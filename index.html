<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Multi — SofaScore</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07111f;color:#eef5ff}.wrap{max-width:1100px;margin:auto;padding:14px}.hero{background:#102846;border:1px solid #23466d;border-radius:20px;padding:20px}h1{margin:0 0 5px}.muted{color:#9db2ca}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tab,button,select{border:0;border-radius:11px;padding:12px;font-weight:700}.tab{min-width:100px;background:#162c44;color:#cfe0f2}.tab.active{background:#1d7cff;color:#fff}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}select{width:100%;background:#12243a;color:white;border:1px solid #315273}button{background:#20c77a;cursor:pointer}.status,.card{background:#0d1b2c;border:1px solid #203c5a;border-radius:15px;padding:14px}.status{margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.league{font-size:12px;color:#7fb5eb}.teams{font-size:17px;font-weight:800;margin-top:7px}.time{color:#9db2ca;margin:7px 0}.pick{background:#102c46;padding:10px;border-radius:9px}.safe{color:#55e69d;font-weight:800}.multi{margin:12px 0}.error{color:#ff8e8e}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><h1>⚽ Safe Multi</h1><div class="muted">Live & upcoming football • Bangladesh time • SofaScore</div><div class="tabs">
<button class="tab active" data-w="live">LIVE</button><button class="tab" data-w="6">6 Hours</button><button class="tab" data-w="12">12 Hours</button><button class="tab" data-w="24">24 Hours</button><button class="tab" data-w="48">48 Hours</button></div><div class="controls">
<select id="count"><option>3</option><option>5</option><option selected>10</option><option>15</option><option>20</option></select><select id="min"><option>1.00</option><option selected>1.25</option><option>1.40</option></select><select id="max"><option>1.60</option><option selected>2.00</option><option>2.50</option><option>3.00</option></select><button id="gen">GENERATE SAFE MULTI</button></div></section><div id="status" class="status">Loading…</div><div id="multi" class="multi"></div><div id="matches" class="grid"></div></div><script>
const S={w:"live",m:[]},$=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),time=t=>new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Dhaka",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(t*1000))+" BST";
function render(){ $("matches").innerHTML=S.m.length?S.m.map(m=>`<div class="card"><div class="league">${esc(m.country)}${m.country&&m.league?" • ":""}${esc(m.league)}</div><div class="teams">${esc(m.home.name)} <span class="muted">vs</span> ${esc(m.away.name)}</div><div class="time">${m.status==="live"?"🔴 LIVE • ":""}${time(m.startTimestamp)}${m.status==="live"?`<br>Score: ${m.homeScore} - ${m.awayScore}`:""}</div><div class="pick"><span class="safe">Candidate:</span> ${esc(m.pick)}</div></div>`).join(""):"<div class='card'>No matches found.</div>"}
async function load(){ $("status").textContent="Loading SofaScore data…";try{let r=await fetch("/api/football?type="+S.w,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"API error");S.m=d.matches||[];$("status").textContent=S.m.length+" matches loaded • "+new Date().toLocaleTimeString();render()}catch(e){$("status").innerHTML="<span class='error'>❌ "+esc(e.message)+"</span>";$("matches").innerHTML=""}}
function generate(){let n=+$("count").value,min=+$("min").value,max=+$("max").value,a=S.m.filter(x=>x.odds>=min&&x.odds<=max).sort((x,y)=>y.safeScore-x.safeScore).slice(0,n);$("multi").innerHTML=a.length?`<div class="card"><h2>🛡️ Safe Multi (${a.length})</h2>${a.map((m,i)=>`<div style="padding:9px 0;border-bottom:1px solid #203c5a">${i+1}. <b>${esc(m.home.name)} vs ${esc(m.away.name)}</b><br><span class="muted">${esc(m.league)} • ${esc(m.pick)} • Odds ${m.odds.toFixed(2)} • Score ${m.safeScore}/100</span></div>`).join("")}<p class="muted">No pick is guaranteed.</p></div>`:"<div class='card'>No candidates in this odds range.</div>"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.w=b.dataset.w;load()});$("gen").onclick=generate;load();setInterval(load,60000);
</script></body></html>
